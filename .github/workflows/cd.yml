name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Deploy Railway
        run: |
          SERVICE="${RAILWAY_SERVICE_ID:-${RAILWAY_SERVICE_NAME:-tetrisMaster}}"
          echo "Deploying to Railway service: ${SERVICE}"
          npx @railway/cli@4.66.0 up --ci --verbose --service "${SERVICE}"
